name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  dataset:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_dataset.py -v
      - run: python -m unittest discover -s tests -p test_setup.py -v
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r minecraft_biomas/requirements.txt -r requirements-dev.txt
      - run: python -m pytest tests -q
